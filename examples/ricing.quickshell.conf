# Exemple : ricing à shell Quickshell complet piloté par IPC (qs -c <config> ipc call …).
description=NIHIL (poligle) — OLED-black dot-matrix desktop: hand-written Quickshell frame/bar/drawers, dot wallpapers (awww), hyprlock, port of the NixOS flake on top of Omarchy's defaults

# Official repos, only those not installed yet (checked with pacman -Si / -Q).
# awww: wallpaper daemon · hyprlock: lock screen · python-pillow: dot renders of
# new outputs, lock glass and album art · pavucontrol / network-manager-applet /
# lxqt-policykit: the panel's audio and Wi-Fi settings, polkit prompts.
packages=awww hyprlock python-pillow pavucontrol network-manager-applet lxqt-policykit
setup=./setup.sh

# Shell (frame, bar, drawers, notifications, OSD) + session services
# (cliphist watcher; nihil-session: awww + wallpaper, hypridle, nm-applet,
# polkit agent — each only when not already running).
start=qs -c nihil
start=pgrep -u "$(id -u)" -f "^wl-paste --watch .*nihil-clipboard store" >/dev/null || wl-paste --watch ~/.config/quickshell/nihil/scripts/nihil-clipboard store
start=~/.config/quickshell/nihil/scripts/nihil-session
# Only NIHIL's own daemon is stopped; shared ones (wl-paste watchers,
# nm-applet, polkit agent, hypridle) are started only when missing.
stop=awww-daemon

# Omarchy actions -> NIHIL shell IPC (qs -c nihil ipc call <target> <fn>).
bind:menu.root=qs -c nihil ipc call drawers toggle launcher
bind:menu.apps=qs -c nihil ipc call drawers toggle launcher
bind:omarchy-shell omarchy.dock apps=qs -c nihil ipc call drawers toggle launcher
bind:menu.system=qs -c nihil ipc call drawers toggle panel
bind:menu.toggle=qs -c nihil ipc call drawers toggle dashboard
bind:menu.hardware=qs -c nihil ipc call settings page screens
bind:menu.background=qs -c nihil ipc call drawers toggle wallpapers
bind:menu.theme=qs -c nihil ipc call settings page look
bind:menu.capture=~/.config/quickshell/nihil/scripts/nihil-shot region
bind:panel.omarchy.clipboard=qs -c nihil ipc call clipboard open
bind:panel.omarchy.audio=qs -c nihil ipc call drawers toggle panel
bind:panel.omarchy.bluetooth=qs -c nihil ipc call drawers toggle panel
bind:panel.omarchy.network=qs -c nihil ipc call drawers toggle panel
bind:panel.omarchy.power=qs -c nihil ipc call drawers toggle panel
bind:panel.omarchy.monitor=qs -c nihil ipc call settings page screens
bind:panel.omarchy.clock=qs -c nihil ipc call drawers toggle dashboard
bind:panel.omarchy.elsewhen=qs -c nihil ipc call drawers toggle dashboard
bind:audio.raise=~/.config/quickshell/nihil/scripts/osd-volume up
bind:audio.lower=~/.config/quickshell/nihil/scripts/osd-volume down
bind:audio.mute-toggle=~/.config/quickshell/nihil/scripts/osd-volume mute
bind:omarchy-audio-input-mute=~/.config/quickshell/nihil/scripts/osd-mic
bind:brightness.raise=~/.config/quickshell/nihil/scripts/osd-brightness up
bind:brightness.lower=~/.config/quickshell/nihil/scripts/osd-brightness down
bind:ipc.media.playPause=qs -c nihil ipc call media toggle
bind:ipc.media.next=qs -c nihil ipc call media next
bind:ipc.media.previous=qs -c nihil ipc call media previous
bind:ipc.notifications.act=qs -c nihil ipc call drawers toggle panel
bind:ipc.notifications.showHistory=qs -c nihil ipc call drawers toggle panel
bind:ipc.notifications.dismissAll=qs -c nihil ipc call notifs clear
bind:ipc.notifications.dismissOne=none
bind:ipc.notifications.invokeLast=none
bind:omarchy-system-lock=~/.config/quickshell/nihil/scripts/lock-screen
bind:omarchy-toggle-bar=none
bind:omarchy-menu-keybindings=qs -c nihil ipc call settings page keys
bind:omarchy-toggle-idle=qs -c nihil ipc call caffeine toggle
bind:omarchy-toggle-notification-silencing=qs -c nihil ipc call notifs toggleDnd
bind:omarchy-capture-screenshot=~/.config/quickshell/nihil/scripts/nihil-shot region
bind:omarchy-capture-screenrecording --stop-recording || omarchy-menu toggle trigger.capture.screenrecord=~/.config/quickshell/nihil/scripts/nihil-record toggle region
