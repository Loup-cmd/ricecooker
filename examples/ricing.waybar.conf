# Exemple : ricing waybar + swaync + rofi sur base Omarchy sans son shell.
# Interface: waybar + swaync + rofi (adi1090x launchers/applets), no Omarchy shell.
description=Chainsaw Man "blue monday dots": waybar pill bar, swaync, rofi launcher and powermenu, wind animations
packages=waybar swaync rofi hyprlock hypridle pavucontrol ttc-iosevka ttf-jetbrains-mono-nerd
packages=cliphist wl-clipboard playerctl python-gobject networkmanager

wallpaper=builtin

start=waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
start=swaync
start=hypridle
start=pgrep -f "^wl-paste --type text --watch cliphist" >/dev/null || wl-paste --type text --watch cliphist store
start=pgrep -f "^wl-paste --type image --watch cliphist" >/dev/null || wl-paste --type image --watch cliphist store

stop=waybar
stop=swaync
stop=hypridle

bind:menu.root=rofi -show drun -theme ~/.config/rofi/launchers/type-3/style-3.rasi
bind:menu.apps=rofi -show drun -theme ~/.config/rofi/launchers/type-3/style-3.rasi
bind:omarchy-shell omarchy.dock apps=rofi -show drun -theme ~/.config/rofi/launchers/type-3/style-3.rasi
bind:menu.system=bash ~/.config/rofi/applets/bin/powermenu.sh
bind:panel.omarchy.power=bash ~/.config/rofi/applets/bin/powermenu.sh
bind:omarchy-toggle-bar=pkill -SIGUSR1 waybar
bind:omarchy-system-lock=pidof hyprlock || hyprlock
bind:panel.omarchy.clipboard=bash ~/.config/hypr/scripts/clipboard.sh
bind:panel.omarchy.audio=pavucontrol
bind:panel.omarchy.network=omarchy-launch-or-focus-tui nmtui
bind:ipc.notifications.act=swaync-client -a
bind:ipc.notifications.invokeLast=swaync-client -a
bind:ipc.notifications.dismissOne=swaync-client --close-latest
bind:ipc.notifications.dismissAll=swaync-client -C
bind:ipc.notifications.showHistory=swaync-client -t -sw
bind:omarchy-toggle-notification-silencing=swaync-client -d
